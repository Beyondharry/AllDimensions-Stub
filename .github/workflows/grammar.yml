name: Grammar Maintainance
on:
  schedule:
    - cron: '0 4 * * 3'      # weekly, Wednesday 04:00 UTC
  workflow_dispatch:
    inputs:
      dry_run:
        type: boolean
        default: true
concurrency:
  group: stubmanager
  cancel-in-progress: false
jobs:
  grammar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node grammar-bot.mjs
        env:
          WIKI_API: ${{ secrets.WIKI_API }}
          BOT_USER: ${{ secrets.GRAMMAR_BOT_USER }}
          BOT_PASS: ${{ secrets.GRAMMAR_BOT_PASS }}
          DRY_RUN: ${{ inputs.dry_run && '1' || '' }}
      - uses: actions/upload-artifact@v4
        if: ${{ always() && hashFiles('out/**') != '' }}
        with: { name: grammar-dry-run, path: out/ }
