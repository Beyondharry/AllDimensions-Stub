name: Redirect & Self-Link Maintainance

on:
  schedule:
    - cron: '43 */2 * * *'   # every 2 hours at :43 UTC
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (1 = no edits)'
        default: '1'

concurrency:
  group: stubmanager
  cancel-in-progress: false   # never run two copies at once

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run Redirect & Self-Link Bot
        run: node redirect-selflink-module.mjs
        env:
          WIKI_API: ${{ secrets.WIKI_API }}
          BOT_USER: ${{ secrets.BOT_USER }}
          BOT_PASS: ${{ secrets.BOT_PASS }}
          EXEMPT_TITLE_REGEX: ${{ secrets.EXEMPT_TITLE_REGEX }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || '0' }}
